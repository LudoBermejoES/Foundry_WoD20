name: Preflight & Deploy WoD System

# CI + CD for the `worldofdarkness` Foundry SYSTEM, in ONE workflow.
#
# ===========================================================================
# THE ORDERING IS THE POINT OF THIS FILE
# ===========================================================================
# 2026-07-30, part 1 (commit a73035f) added the offline gate: before it, every
# push to main rsynced the whole tree straight onto the live Foundry server with
# NOTHING in front of it — no test job, no manifest validation, no syntax check —
# and the only thing checked afterwards was rsync's own exit code, which proves
# rsync ran, not that the bytes Foundry will load are the bytes that were pushed.
# 17 deploys had run that way (measured from `gh run list`, 2026-07-23 →
# 2026-07-28).
#
# 2026-07-30, part 2 (this revision) closes the LevelDB corruption hazard the
# first part explicitly left open, and RETRACTS the reasoning it left behind.
# That reasoning said a system is "plain JS that Foundry re-reads on the next
# restart", so stopping the server bought nothing. It was WRONG: this tree ships
# 33 compiled LevelDB pack directories under packs/, and they were rsynced with
# --delete under a live Foundry on every push.
#
# rsync --delete replaces files by unlinking and recreating them. A Foundry
# process holding a pack open keeps its descriptors pointing at the now DELETED
# inodes: its writes go to an unlinked inode, its reads return the pre-deploy
# tree, and on the next open LevelDB may run RepairDB — which DISCARDS THE DATA
# AND KEEPS THE METADATA. It never surfaces as an error; it presents as
# "compendium search returns nothing", and only a PROCESS RESTART recovers it (a
# GM world reload does not). It destroyed all 86 packs of wod20-compendium-es on
# 2026-07-27. On a SYSTEM the blast radius is every world on the server rather
# than one module's content.
#
# Not theoretical here. Measured on the live server 2026-07-30, before this
# revision:
#   * all 32 non-empty pack dirs carried a LevelDB generation NEWER than the
#     committed one (packs/lunarshapeshifting: server MANIFEST-001258 +
#     001259.log vs this repo's MANIFEST-001226 + 001227.log) — i.e. the live
#     process reopened and rewrote them after the last deploy;
#   * the live Foundry (pid 2041202) held 128 open descriptors inside
#     .../systems/worldofdarkness/packs, four per non-empty pack: the current
#     *.log, LOCK, LOG and MANIFEST-*. An rsync --delete at that instant unlinks
#     all 128 and rewinds every CURRENT to name an OLDER manifest than the one
#     the running process is using;
#   * LOCK is not tracked in git here, so --delete unlinks the running database's
#     own lock file.
#
# So the sequence is now structural:
#
#   preflight            offline validation of the committed tree. Never touches
#                        the server. `deploy` declares `needs: preflight`, so a
#                        tree that fails here cannot reach the server at all.
#   TAKE THE DEPLOY LOCK a server-side lock directory shared with the other repos
#                        that deploy to this Foundry. `concurrency:` is
#                        per-repository and could not cover them; on 2026-08-02 a
#                        wod20-compendium-es deploy restarted Foundry two seconds
#                        into this one's transfer window (run 30753691518 vs their
#                        30753690312). Half a mutex until that repo takes the same
#                        lock — see the mutex header in foundry-deploy-lib.sh.
#   stop + VERIFY DOWN   pm2 stop, then poll ps AND port 30000 until both are
#                        empty. pm2's exit code is printed and IGNORED — it has
#                        lied in this project before. Timeout => FAIL, no rsync.
#   rsync                re-asserts "down" over ssh immediately before the
#                        transfer, closing the gap between the stop step and this
#                        one (an operator, `pm2 resurrect` or a queued run could
#                        have brought it back), and aborts before writing a byte.
#   verify bytes         per-file sha256 of what LANDED vs what was PUSHED, while
#                        Foundry is still DOWN — the only moment the two trees are
#                        comparable, because Foundry mutates LOCK/LOG/WAL/MANIFEST
#                        as soon as it opens a pack. That precondition is now
#                        MEASURED after the audit instead of merely claimed in the
#                        step name, and a mismatch says which of the two possible
#                        causes it is (a raced open vs a bad transfer).
#   start + VERIFY UP    process present, port listening, /api/status serving.
#                        Runs with `if: always()`, so a failure above still brings
#                        Foundry back — and says so LOUDLY if it cannot.
#   post-start verify    ZERO deleted-inode descriptors inside the system
#                        directory, i.e. the incident signature is measured to be
#                        absent, and the restarted Foundry reports the system
#                        version that was just pushed.
#
# A FAILED DEPLOY IS STRICTLY BETTER THAN A CORRUPTED ONE. Every gate fails the
# job rather than proceeding on an assumption.
#
# THIS REPLACES A MANUAL STEP; IT DOES NOT ADD AN OUTAGE. A system change only
# takes effect when the Foundry PROCESS restarts, so an operator `pm2 restart
# foundryvtt` was already required after every deploy — the previous revision of
# this file printed a reminder saying exactly that. Doing the restart here
# REMOVES that manual step and closes the hazard at the same time. Connected
# players are still dropped for the duration of the restart; that cost has not
# changed, it has only moved into CI where it is bounded and verified.
#
# Branch protection is not available on this repo (private, no Pro), so the gate
# has to be expressible inside the workflow itself — hence one workflow with two
# jobs and `needs:`, rather than a separate CI workflow that would merely RACE
# the deploy.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

# Serialises deploys OF THIS REPO — two runs must never stop/start Foundry or
# rsync into the same tree at once. It CANNOT serialise against the other repos
# that write to the same Foundry server (wod20-compendium-es →
# Data/modules/wod20-compendium-es, wod20-combat-foundryvtt →
# Data/modules/wod20-combat-foundryvtt): concurrency groups are per-repository,
# and GitHub offers no cross-repo group.
#
# That gap is no longer covered by a comment asking people not to push both at
# once — it bit on 2026-08-02 (this run vs wod20-compendium-es run 30753690312;
# see the "cross-repo deploy mutex" header in .github/scripts/foundry-deploy-lib.sh
# for the second-by-second timeline). It is now covered by a SERVER-SIDE lock
# directory taken below, before the stop gate, and released after the restart.
# NOTE: that lock only becomes a real mutex once wod20-compendium-es takes the
# same one; until then this side always acquires uncontended.
concurrency:
  group: foundry-system-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The gate. Entirely offline — it only reads the checkout, so it cannot break
  # anything, and it is the only thing standing between a bad commit and every
  # actor sheet on the server. Also the PR check: on a pull_request this is the
  # only job that runs.
  #
  # HONEST SCOPE: this repo has no test suite, no build step and no linter
  # (measured 2026-07-30 — no package.json, no test runner config, no eslint
  # config anywhere in the tree), and none is invented here. What runs is
  # validation of the committed artifact, not coverage of the game logic: the
  # manifest must be loadable and internally consistent, every file it names must
  # exist, every committed JSON must parse, every relative import must resolve,
  # and every .js file must be parseable JavaScript. A logic bug still ships.
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight (offline validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # version-bump-check.py compares system.json against HEAD~1, so the default
          # shallow single-commit checkout is not enough.
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # system.json / template.json / lang/*.json / packs/ / the import graph.
      # Runnable locally: python3 .github/scripts/system-preflight.py
      - name: Validate the system manifest and the committed tree
        run: python3 .github/scripts/system-preflight.py

      # node --check over every committed .js, with the parse goal pinned by
      # extension (see the script header — `node --check foo.js` silently exits 0
      # on a broken ES module in this repo).
      # Runnable locally: bash .github/scripts/js-syntax-check.sh
      - name: Syntax-check every committed JavaScript file
        run: bash .github/scripts/js-syntax-check.sh

      # Templates were the one committed file class with NO gate at all: preflight reads the
      # manifest and the import graph, js-syntax-check skips .hbs, and the three module-logic
      # harnesses execute `module/`, never a template. A Handlebars comment closed with `--}`
      # instead of `--}}` is unterminated, and Handlebars then SWALLOWS the markup up to the
      # next `--}}` — on 2026-08-04 that ate a `<div>`, an `<i>` and a `<label>` opening tag
      # from an ability row, and every gate above said OK. Caught only by diffing tag counts
      # against HEAD by hand; this makes that a gate. Handlebars is not vendored here, so it is
      # structural rather than a real compile.
      - name: Structure-check every committed template
        run: python3 .github/scripts/template-structure-check.py

      # A CSS rule that matches NOTHING is indistinguishable from one that works — and on 2026-08-04
      # that cost the sheet a real distinction. `.secondaryAbility.ability-headlineWidth` made
      # secondary abilities italic, which is the only thing telling them apart from primaries in the
      # shared column. Adding the description eye moved the label into a flex cell, so the width class
      # went onto the wrapping <div> and the text class stayed on the <label>: both still present, on
      # two elements, and a compound selector needs them on one. The template still emitted the class,
      # the structure check still balanced, the module harnesses still passed. Only a human looking at
      # a sheet noticed, a day later. This compares the two sides instead.
      - name: Prove every compound CSS selector can match something
        run: python3 .github/scripts/css-selector-reachability.py

      # `primary` in powertab.js sets a section's ORDER, not its membership — BuildPowerSections
      # also walks `defaultOrder` and adds whatever it has not already added. 7.5.44 dropped
      # "rotes" from mage's `primary` alone and shipped the Rote list rendering on TWO tabs; the
      # mistake is invisible in a diff because each file is correct on its own. This reads both
      # lists together, which is the only way to see it.
      - name: Check no power section renders on two tabs
        run: python3 .github/scripts/power-section-check.py

      # Three rules on the v3 stylesheet, and the reason this exists at all is that the file's own
      # header claimed the check ran before the check was written — a comment asserting a gate that
      # does not exist is worse than no comment, because the next reader trusts it. Zero literal
      # colours (darkmode.css loads LAST, so a hard-coded colour yields a half-dark sheet), every
      # selector carrying `.pc-actor-v3` in its first compound (the v2 and v3 sheets differ by
      # exactly that class), and a hard cap of six `!important` on the float neutralisers.
      - name: Check the v3 stylesheet stays scoped and themeable
        run: python3 .github/scripts/v3-css-check.py

      # A deploy must not reuse the previous commit's version. On 2026-08-05 two different trees
      # went to the live server as 7.5.63: one commit bumped 7.5.62 -> 7.5.63, and the next bumped
      # with `sed 's/7.5.62/7.5.63/'` against a tree that had already moved, so it matched nothing
      # and changed nothing — silently, because sed exits 0 when it replaces zero occurrences. Every
      # gate passed and the deploy truthfully reported "loaded worldofdarkness 7.5.63" both times.
      # The manifest check above validates the version's SHAPE and never that it CHANGED, and
      # CLAUDE.md has long said the bump is "still manual and still required" — which without a check
      # means "required until someone is tired". The version is what a GM reads to know whether a fix
      # reached them.
      # Runnable locally: python3 .github/scripts/version-bump-check.py
      - name: Check the system version was actually bumped
        run: python3 .github/scripts/version-bump-check.py

      # Creature Charms. Until 7.5.62 all six live creature PCs sat in a closed loop that nothing in
      # this file could see: the Charms section renders only for an actor that already HOLDS a charm,
      # the flag gating it is derived from the items held, and `CreateButtonsPowerv2` — the PC
      # power-create dialog — had no charm branch at all. No charm, no flag, no section, no way to
      # make the first one. Worse, a `buttons.charm` DID exist in the legacy `CreateButtonsPower`,
      # gated on a nested key that is `undefined` on a PC actor, so the repo contained something that
      # looked like the feature while being unreachable. Deleting the fix would be silent again —
      # it is not a data-action, a template, a string or a colour. This extracts the gate CONDITION
      # from source and executes it against fixture actors with the real `getSplat`, so a gate
      # swapped back to the flag alone fails behaviourally, not just on a regex.
      # Runnable locally: node .github/scripts/test-charm-button.mjs
      - name: Prove a creature can create its first Charm
        run: node .github/scripts/test-charm-button.mjs

      # The light theme, reported broken on 2026-08-05. `css/darkmode.css` opened with a `:root`
      # block defining eighteen `--main-<line>-mid/dim-color` tokens that `css/wod.css:108` ALSO
      # defines at `:root` with the LIGHT values. Same specificity, and system.json loads
      # darkmode.css LAST, so the dark values won in BOTH themes — nine of them actually differ
      # (0.2 vs the authored 0.12), so every light theme in this system had been drawing them dark
      # for as long as both files existed. Invisible to everything else here: not a literal colour,
      # not a scoping error within one file, not visible in a diff of either file alone. The bug
      # lives in the RELATIONSHIP between two files plus the load order in a third, which is
      # exactly what this reads. Tokens defined ONLY in darkmode.css are not flagged — they have no
      # light value to kill, and they must stay at :root because css/chat.css reaches them from
      # Foundry's own `.theme-dark` sidebar, outside every WoD application root.
      # Runnable locally: python3 .github/scripts/theme-token-scope-check.py
      - name: Check darkmode.css cannot override the light theme
        run: python3 .github/scripts/theme-token-scope-check.py

      # I11 above checks that a key EXISTS. Nothing checked what it CONTAINS, and on 2026-08-05 a
      # script adding the ten `wod.power.empty.*` sentences wrote one of them over
      # `wod.bio.wraith.death` — the "Death" caption on a wraith's Biography tab — in en.json AND
      # es.json. Every gate in this file passed: the key existed before and after, the markup did
      # not change, and `test-part-render.mjs` asserts structure, not prose. This is the only gate
      # here that reads a STRING'S VALUE. It caps every key rendered in a field-label slot (a
      # `label:` in assets/data/sheet/*.js, or a `{{localize}}` inside a `floating-label`) at 45
      # characters in every language — the longest real label is 25, so it is a tripwire for a
      # PARAGRAPH arriving where a caption belongs, not a style rule. Its first clean run found a
      # pre-existing one: pt-BR had replaced `aretecasting.spendingtime` with a 76-character rules
      # explanation, which rendered on the Rote sheet and in both casting dialogs.
      # Runnable locally: python3 .github/scripts/label-length-check.py
      - name: Check no field label holds a sentence
        run: python3 .github/scripts/label-length-check.py

      # The first gate that reads a template AGAINST THE JAVASCRIPT THAT RENDERS IT.
      # `template-structure-check.py` above checks a template against itself — comments,
      # nesting, tag balance, partial registration — and every one of these four passes that
      # while being wrong, because each file is correct on its own:
      #   I1  a `data-action` no sheet registered. ApplicationV2 looks the name up in
      #       `options.actions` and, finding nothing, does nothing: the control renders, takes
      #       the pointer cursor, and is dead. There is one on the live sheet today.
      #   I5  a part with no `case` in `_preparePartContext` renders with only the shared
      #       context, so the tab comes up BLANK — the failure this sheet hit TWICE in the week
      #       of 2026-08-04, with no error and no console warning either time.
      #   I7  a dot that is not a `<span>`. `SetupDotCounters_v2` paints `.resource-value-step`
      #       with no tag; `OnDotCounterChange` indexes `span.resource-value-step` and returns
      #       early on `index >= steps.length`. The two disagreeing means the dot highlights on
      #       load and silently refuses to persist on click.
      #   I11 a `LANG:` placeholder, or a `{{localize}}` key missing from lang/en.json or
      #       lang/es.json. Foundry renders a missing key VERBATIM, and the live world runs ES,
      #       so an EN-only key is invisible to everyone who reads the sheet in English.
      # Scoped to actor templates (I1/I5/I7) and to every template (I11). Three counted
      # allowlists carry the pre-existing findings; each prints a ::warning:: on every run.
      # Runnable locally: python3 .github/scripts/sheet-invariants.py
      - name: Check the actor sheet's actions, parts and strings
        run: python3 .github/scripts/sheet-invariants.py

      # I3/I4. `_onRender` binds behaviour with 21 hard-coded CSS selectors, one of them a
      # direct-child chain. An empty NodeList is not an error and every binder starts
      # `if (!x?.length) return;`, so a renamed class or an inserted wrapper `<div>` removes a
      # feature with no exception, no console warning and no visual difference — which is what
      # nothing else here can see: the JS parses, the template is well-formed, and only the two
      # read TOGETHER are wrong. It matters now because `add-pc-sheet-v3` adds the first
      # ApplicationV2 SUBCLASS in this repo: a subclass inherits those binders while replacing
      # the markup they run against, so the check evaluates them PER SHEET and a v3 shell that
      # drops a class goes red on its own. The selector list and the files it comes from are
      # both PARSED out of the source — a hand-copied list rots, which is the same reasoning
      # that makes power-section-check.py read both powertab lists instead of trusting either.
      # Runnable locally: python3 .github/scripts/binder-selector-check.py
      - name: Check every hard-coded binder selector is still producible
        run: python3 .github/scripts/binder-selector-check.py

      # The deploy job below drives Foundry's lifecycle through this script. A
      # syntax error in it would be discovered halfway through a deploy, i.e.
      # with Foundry stopped.
      - name: Syntax-check the deploy library
        run: |
          set -euo pipefail
          bash -n .github/scripts/foundry-deploy-lib.sh
          bash -n .github/scripts/test-down-gate.sh
          bash -n .github/scripts/test-deploy-lock.sh
          # The dispatcher must reject an unknown subcommand rather than silently
          # succeed, otherwise a typo in a `bash -s -- stop` call would look like
          # a successful stop.
          if bash .github/scripts/foundry-deploy-lib.sh definitely-not-a-subcommand >/dev/null 2>&1; then
            echo "::error::foundry-deploy-lib.sh accepted an unknown subcommand"
            exit 1
          fi
          echo "foundry-deploy-lib.sh parses and rejects unknown subcommands."

      # Asserts that `stop` REFUSES when pm2 exits 0 but Foundry is still alive —
      # the failure mode that destroys packs. Fully offline: fake pm2/ss on PATH
      # and a fake process. Takes ~25s because it proves the poll loop really
      # waits instead of spinning.
      - name: Prove the verified-down gate refuses a lying pm2
        run: bash .github/scripts/test-down-gate.sh

      # The deploy lock is the FIRST step of the deploy job and it can fail the
      # job, so both directions matter and both are asserted offline: it must
      # refuse a second holder (admitting one re-opens the corruption race), and
      # it must not block a deploy when the lock path is unusable or was left
      # behind by a cancelled run.
      - name: Prove the cross-repo deploy lock excludes, expires and degrades
        run: bash .github/scripts/test-deploy-lock.sh

      # The FIRST gate in this repo on MODULE LOGIC rather than on deploy
      # plumbing. Everything above validates the manifest, the tree and the
      # deploy scripts; a logic bug in a sheet still shipped to every actor on
      # the server. This one copies `module/` to a temp dir, stubs the Foundry
      # globals and EXECUTES the real `_preCreate`/`_preUpdate`/`AbilityHelper`
      # against them, so it can catch what a syntax check cannot: a key derived
      # by the wrong rule, or overwritten when it should have been preserved.
      # A wrong `system.id` is worse than none — the wod20-char importer prefers
      # a carried key over the item's name — so this is the gate that keeps that
      # from reaching a live sheet. Offline, no Foundry, ~1s.
      - name: Prove secondary-ability keys are derived and never clobbered
        run: node .github/scripts/test-secondability-id.mjs

      # Sibling of the harness above, same mechanism, different question: WHICH
      # DOCUMENT SHAPES does the description-enrichment path accept? The filter it
      # guards is a one-liner that is wrong in BOTH directions, so this pins both:
      #   - too narrow (`d.type === "Ability"`) and the 25 secondary-ability
      #     documents stop resolving the moment
      #     make-secondary-abilities-secondary-everywhere B1 retypes them to
      #     `Trait` — presenting as a BLANK DESCRIPTION WINDOW plus a console
      #     warning, which this project's notes record as a false-alarm generator
      #     ("a blank description reads as a missing translation");
      #   - too wide (any `Trait`) and the 104 non-ability Trait documents the
      #     packs ship — 87 maneuvers, 17 mage resonances, and `mage-resonance`
      #     IS searched for a mage — enter name-matching against every mage's
      #     abilities, which is the cross-contamination shape that once overwrote
      #     89 live actors with another game line's rules.
      # It also runs the four (item shape x document shape) combinations, so the
      # gate fails if this fork ever depends on the content packs having been
      # deployed first. Offline, no Foundry, no compendium, ~1s.
      - name: Prove ability enrichment accepts retyped secondaries and nothing more
        run: node .github/scripts/test-ability-enrichment-types.mjs

      # Third of the same family, and the first that drives a SHEET AFFORDANCE:
      # it calls the real `CreateHelper.CreateButtonsCore(actor)` and INVOKES the
      # three secondary-ability buttons' callbacks, then runs the document that
      # lands through the real `_preCreate`/`_preUpdate`. It exists because the
      # obvious way to write those buttons is to copy the four beside them, and
      # that copy is WRONG in a way nothing else here can see: `Ability` has a
      # DataModel whose flags nest under `system.settings`, `Trait` has none, so
      # template.json merges `settings` FLAT into `system` — a `system.settings`
      # object on a secondary is dead weight that re-creates the two-carriers
      # defect the change was raised to remove. It also sweeps EVERY `lang/*.json`
      # to prove each language's placeholder key stays overwritable both in its
      # own session and across sessions, so the rename can settle the real key
      # instead of the placeholder's freezing and then BEATING the real name at
      # import time. And it runs the real `ItemHelper._sortTraits` over the born
      # item, so the claim "both sheet families read the same carrier" is executed
      # rather than asserted. Mutation-tested: 35/24/15/1/10/9/2/1/17/4 of its 41
      # checks fall across ten reversions. Offline, no Foundry, ~1s.
      - name: Prove the PC sheet's secondary-ability buttons create the right shape
        run: node .github/scripts/test-create-secondability-button.mjs

      # I12, and the ONLY gate here that RENDERS A TEMPLATE. Everything above reads a template
      # against itself or against the JS statically; this one runs the nine real `prepare*Context`
      # functions over a fixture actor of every structure `config.js` declares (13 splats x
      # variantsheet + the variant branches the templates themselves are found to make = 173) and
      # renders all nine parts for each.
      #
      # It exists for one failure that nothing else can see: a template reading a context key its
      # PART's preparer never built. An ApplicationV2 part only carries the context its own preparer
      # produced, so moving an include without moving the context renders the block EMPTY — no
      # exception, no console warning, nothing in any log. That happened THREE times in the week of
      # 2026-08-04 (Spheres, Rotes, an unregistered partial) and a human found it each time. The
      # renderer here is instrumented, so it reports the structure, the part, the template, the line
      # and the key.
      #
      # Handlebars is not vendored and no dependency may be added, so the renderer is a strict
      # SUBSET that THROWS on anything it does not implement — it can be incomplete, but it cannot
      # pass by rendering a construct it does not understand as nothing. Validated once offline
      # against real Handlebars 4.7.7: 1384/1384 renders identical modulo whitespace.
      # Counted allowlists carry the pre-existing findings and print ::warning:: every run; each is
      # checked for staleness, so an entry that stops firing fails the build instead of quietly
      # masking the next occurrence. Offline, no Foundry, ~1s.
      - name: Prove every sheet part renders for every splat the config declares
        run: node .github/scripts/test-part-render.mjs

      # The eye's window was titled from the document's `name`, which for a template-seeded
      # primary is the ENGLISH string ("Firearms") while every surface that DISPLAYS the row
      # localizes `system.label` ("Armas de Fuego"). Reported from the live sheet. The fallback
      # is the part worth a gate: an i18n key that does not resolve must NOT become the title,
      # because `wod.abilities.something` is worse than the English word. Reads the real
      # lang/es.json from disk, so it cannot pass against a deleted translation.
      - name: Prove the eye's window is titled in the reader's language
        run: node .github/scripts/test-item-viewer-title.mjs

      # The advantage block (Arete, Willpower, Quintessence, Renown, Virtues, Corpus — every line)
      # is built by string concatenation in `getGetStatArea_v2`, and add-pc-sheet-v3 D6 splits it
      # into `buildStatArea()` (the decisions: the wraith Corpus type switch, the werewolf renown and
      # rank, the changeling Willpower imbalance, the `data-state` marker) plus a renderer, so v3 can
      # add a SECOND renderer without forking those four rules into it. This harness vendors the
      # pre-refactor function verbatim and byte-compares it against the real registered helper over
      # 23 fixtures x 4 banner modes. It is the only thing standing between that refactor and 88 live
      # sheets: nothing else here can see markup move, and the failure mode is silent — a dropped
      # `data-state` simply stops the temporary squares painting, and a dropped `data-index` stops
      # dots persisting, with no error either way. (A hand transcription of the same function during
      # this change DID drop `data-state`; the harness caught it before anything was pushed.)
      # Mutation-tested: dropping the corpus switch, the renown switch or the rank, or moving the
      # imbalance bound or the spent-square bound by one, each fails it with the fixture named and
      # the differing byte printed. Offline, no Foundry, ~1s.
      - name: Prove the advantage block's markup has not moved by one byte
        run: node .github/scripts/test-statarea-identity.mjs

      # add-faction-sect-entities — the Mage Bio tab's free-text "Secta" row grows an eye once its
      # value matches a `mage-sects` compendium document, via a NEW `matchNameDirectly` match mode
      # in `trait-enrichment.js` (the two existing kinds, Attribute/Sphere, match a stable per-row
      # KEY against a CONFIG label table — Secta has no key at all, only its own free-text value).
      # Pins the template gate (`key === "sect"`), the context wiring (Mage-only), and the resolver
      # itself against stubbed packs in both directions: a real match, a case/whitespace-insensitive
      # match, an unmatched/custom value, a missing pack, and a regression check that
      # `matchNameDirectly` did not leak into the Attribute kind's CONFIG-label matching. Offline, no
      # Foundry, ~1s.
      - name: Prove the Mage Secta eye icon resolves by name, and only for Mage
        run: node .github/scripts/test-sect-eye-icon.mjs

      # propagate-health-bonus-traits: `resyncActorTraits`/`buildCompendiumIndex` had NO test
      # coverage at all before this line existed — measured, no `.github/scripts/*.mjs` referenced
      # either export. Found by live-verifying a real actor (Raffela Diemer, a mage/mortal Sleeper):
      # `settings.splat` is "mortal", which has no compendium packs, so a line-specific trait
      # (Corpulento) was silently skipped forever, and the per-migration-version flag was still set,
      # so it could never self-heal. Fixed by resolving `settings.game` before `settings.splat`; this
      # pins that order and its two guard cases (a genuinely splat-less mortal must still no-op; an
      # item with an existing bonuslist must never be overwritten).
      # Runnable locally: node .github/scripts/test-trait-resync-line.mjs
      - name: Prove trait re-sync resolves a mortal-variant actor's real game line
        run: node .github/scripts/test-trait-resync-line.mjs

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Foundry server
    needs: preflight
    # `needs: preflight` already skips this job when the gate fails; `success()`
    # is spelled out because adding an `if:` to a gated job is exactly where that
    # guarantee gets accidentally dropped. The event check keeps pull_request
    # runs validation-only.
    if: ${{ success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # NOTE: only github, needs, secrets, vars, inputs, strategy and matrix are
    # available in a job-level `env:`. `${{ runner.temp }}` here is a workflow
    # VALIDATION error — the run dies in 0s with "workflow file issue", before any
    # step executes, so none of the gates in this file would run at all. Paths
    # under the runner temp dir are resolved from $RUNNER_TEMP inside `run:`.
    env:
      TARGET: /var/www/foundrydata/Data/systems/worldofdarkness
      SSH_TARGET: ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      LIB: .github/scripts/foundry-deploy-lib.sh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve runner-temp paths
        run: |
          set -euo pipefail
          echo "SSH_KEY_FILE=$RUNNER_TEMP/foundry_deploy_key" >> "$GITHUB_ENV"
          echo "RSSH=$RUNNER_TEMP/rssh" >> "$GITHUB_ENV"

      # One ssh wrapper for every remote call in this job, so the stop gate, the
      # rsync's re-assert, the byte audit and the restart all reach the server
      # with identical options. Replaces the per-step key setup the previous
      # revision did inside the verify step.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"
          # Trust-on-first-use, the same trust model the easingthemes/ssh-deploy
          # action used (it ran with StrictHostKeyChecking=no).
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Absolute key path on purpose: a literal ~ inside a quoted ssh string
          # is not expanded by the shell, and ssh would resolve it from the passwd
          # entry rather than $HOME.
          cat > "$RSSH" <<'EOF'
          #!/usr/bin/env bash
          exec ssh -i "$SSH_KEY_FILE" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 \
            "$SSH_TARGET" "$@"
          EOF
          chmod +x "$RSSH"
          "$RSSH" 'echo "ssh OK on $(hostname) as $(id -un)"'

      # FIRST thing that touches shared state, and it must stay first: everything
      # below (stop, rsync --delete, byte audit, restart) assumes this run is the
      # only deploy in the Foundry data directory. `concurrency:` above cannot
      # promise that across repositories; this can.
      #
      # It does NOT stop anything or write into the deploy target — it creates one
      # directory outside every target — and an unusable lock path degrades to a
      # warning rather than failing the deploy. The only way this step fails the
      # job is genuine contention, which is precisely when NOT deploying is right.
      - name: Take the cross-repo Foundry deploy lock
        id: lock
        run: |
          set -euo pipefail
          "$RSSH" "DEPLOY_LOCK_OWNER='${GITHUB_REPOSITORY}#${GITHUB_RUN_ID}' bash -s -- lock" < "$LIB"

      # The library is piped over STDIN, so the remote shell's own command line is
      # just `bash -s` and `pgrep -f <foundry entry script>` cannot match the
      # checking shell itself.
      #
      # This is the step that prevents the incident: it does not return until ps
      # AND port 30000 both agree Foundry is gone, and it fails the job (before
      # any rsync) if that cannot be established within DOWN_TIMEOUT.
      #
      # It also covers a case that cannot be checked from here: the pm2 daemon is
      # per-user (it lives in /var/www/.pm2, i.e. www-data's home), and secrets.
      # SSH_USERNAME is not readable from a workflow. If the deploy user were ever
      # NOT the user owning that daemon, `pm2 stop foundryvtt` would talk to an
      # empty daemon and report whatever it likes while the real Foundry kept
      # running. Because the decision is made from ps and the port rather than
      # from pm2, that scenario fails the job instead of corrupting the packs.
      - name: Stop Foundry and VERIFY it is down
        id: stop
        run: |
          set -euo pipefail
          "$RSSH" "FOUNDRY_DIR='$TARGET' bash -s -- stop" < "$LIB"

      # Plain JS/HBS/CSS/JSON read directly by Foundry at load time plus the
      # compiled packs/ — no build step, the committed tree IS the deployable
      # artifact.
      #
      # The rsync ARGS and the EXCLUDE set are the ones the easingthemes/ssh-deploy
      # action was invoked with (ARGS '-rlgoDz --delete', EXCLUDE '.git*, *.md'),
      # so the transfer semantics are unchanged; only the sequencing around it is
      # new. `-v --stats` are additions for the log and change nothing.
      #
      # 'docs' has been REMOVED from the exclude set because there is no docs/ in
      # this repo — the directory is doc/ (87 tracked files, 18M of README
      # screenshots), so the pattern never matched anything and doc/ has always
      # shipped. See the comment on doc/ below the rsync for why it keeps
      # shipping rather than being excluded.
      - name: rsync the system tree (re-asserts Foundry is down first)
        id: rsync
        run: |
          set -euo pipefail

          # Closes the window between the previous step and this one: if anything
          # brought Foundry back (an operator, `pm2 resurrect`, a queued deploy),
          # abort BEFORE the first byte is written.
          "$RSSH" "FOUNDRY_DIR='$TARGET' bash -s -- assert-down" < "$LIB"

          rsync -rlgoDz --delete -v --stats \
            -e "ssh -i $SSH_KEY_FILE -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20" \
            --exclude '.git*' \
            --exclude '*.md' \
            ./ "$SSH_TARGET:$TARGET/"

          # DELIBERATE DECISION ABOUT doc/ (18M of README screenshots, no runtime
          # role — the only doc/ reference in the code is an absolute
          # raw.githubusercontent.com URL in module/ui/settings-sidebar.js, not a
          # local path):
          #
          # It keeps shipping. Adding `--exclude doc` would NOT remove it from the
          # server, because rsync protects excluded files from --delete; the only
          # effect would be to freeze a stale 18M copy there forever, which is
          # worse than a synced one. Actually removing it needs
          # --delete-excluded or a remote `rm -rf`, and adding a destructive
          # operation to a deploy whose entire purpose is to stop being
          # destructive is not a trade worth making for 18M of static images.
          # doc/ is therefore in the verified set below, like every other shipped
          # directory.

      # This comparison is only meaningful while Foundry is DOWN: opening a pack
      # creates LOCK/LOG and a fresh WAL + MANIFEST, so a running Foundry makes
      # the deployed tree legitimately differ from the committed one. That is why
      # this step sits between the rsync and the restart, and why it can now
      # compare the WHOLE pack tree instead of only the immutable *.ldb files as
      # the previous revision had to.
      #
      # An rsync exit code proves rsync was LAUNCHED and returned 0. It does not
      # prove that the tree Foundry will load on the next start is the tree in
      # this commit. Compare per-file sha256 manifests instead.
      #
      # THE STEP NAME NO LONGER ASSERTS "Foundry still down" (2026-08-02). It used
      # to, and the claim was false in run 30753691518: both down-gates were true
      # when they ran, and a wod20-compendium-es deploy started Foundry two seconds
      # later, inside the transfer. So the step now MEASURES the claim instead of
      # printing it — see the assert-down round trip after the audit — and uses the
      # answer to diagnose the failure it would otherwise mislabel as bad bytes.
      #
      # WHAT WAS DELIBERATELY *NOT* DONE: CURRENT / MANIFEST-* / *.log were NOT
      # dropped from the comparison to "make it deterministic". They are exactly
      # the files that move when a live process opens a pack under an rsync
      # --delete, i.e. the signature of the corruption class this whole workflow
      # exists to prevent. Excluding them would have made this step pass silently
      # through the 2026-08-02 race. The comparison is already deterministic given
      # its precondition; the precondition is what needed enforcing (the deploy
      # lock above), not the comparison.
      - name: Verify the deployed tree matches this commit (and that Foundry stayed down)
        id: verify
        run: |
          set -euo pipefail

          # LC_ALL=C on BOTH sides of every sort in this step (the remote audit
          # exports it too). Without it the runner and the server can collate the
          # same file list differently (measured 2026-07-30: a macOS locale
          # ordered ./assets/img/dice/d10_white.svg before
          # ./assets/img/dice/d10.svg, a Linux C locale after), and the diff then
          # reports a mismatch for a byte-identical tree.
          export LC_ALL=C

          # The set of top-level entries rsync actually ships: everything except
          # the EXCLUDE patterns above ('.git*', '*.md') and packs/, which is
          # verified separately below. DERIVED, not hardcoded, so a new top-level
          # file or directory is verified automatically instead of shipping
          # unchecked. If the EXCLUDE input above is ever changed, change this
          # filter with it -- AND the depth-independent one on the `find` that
          # builds expected.sha below, which is the half this filter cannot do
          # and the half that was missing until 2026-08-03.
          mapfile -t SHIPPED < <(ls -A1 | grep -Ev '^\.git|\.md$|^packs$' | sort)
          if [ "${#SHIPPED[@]}" -eq 0 ]; then
            echo "::error::no shippable top-level entries found; refusing to 'verify' nothing"
            exit 1
          fi
          PATHS=""
          for entry in "${SHIPPED[@]}"; do PATHS="$PATHS ./$entry"; done
          echo "Shipped top-level entries:$PATHS"

          # A copy-paste error in TARGET would deploy the system into the wrong
          # directory, where Foundry would ignore it (the directory name must
          # equal the manifest id).
          MANIFEST_ID="$(python3 -c 'import json;print(json.load(open("system.json"))["id"])')"
          if [ "$(basename "$TARGET")" != "$MANIFEST_ID" ]; then
            echo "::error::TARGET is $TARGET but system.json id is '$MANIFEST_ID'; Foundry would ignore the deployed system"
            exit 1
          fi
          VERSION="$(python3 -c 'import json;print(json.load(open("system.json"))["version"])')"

          # Everything the server side does, in one round trip. Read-only: it
          # hashes and lists, and changes nothing. Piped over STDIN so the remote
          # command line stays trivial.
          cat > "$RUNNER_TEMP/remote-audit.sh" <<'REMOTE'
          set -uo pipefail
          export LC_ALL=C
          target="$1"; shift
          cd "$target" || { echo "FATAL missing target $target"; exit 1; }
          for entry in "$@"; do [ -e "$entry" ] || echo "MISSINGPATH $entry"; done
          # shellcheck disable=SC2086
          find "$@" -type f -print0 | xargs -0 -r sha256sum | sort | sed 's/^/SHA /'
          find ./packs -type f ! -name LOCK ! -name LOG ! -name 'LOG.old' -print0 \
            | xargs -0 -r sha256sum | sort | sed 's/^/PACKSHA /'
          find ./packs -name LOCK -type f | sort | sed 's/^/PACKLOCK /'
          for dir in ./packs/*/; do
            dir="${dir%/}"
            ok=OK
            [ -f "$dir/CURRENT" ] || ok=BROKEN
            compgen -G "$dir/MANIFEST-*" > /dev/null || ok=BROKEN
            compgen -G "$dir/*.ldb" > /dev/null || ok=BROKEN
            echo "PACKSTATE ${dir#./} $ok"
          done
          ls -A1 . | sort | sed 's/^/TOP /'
          echo "AUDITDONE"
          REMOTE

          # shellcheck disable=SC2086  # PATHS must word-split
          if ! "$RSSH" "bash -s -- '$TARGET' $PATHS" \
                 < "$RUNNER_TEMP/remote-audit.sh" > "$RUNNER_TEMP/remote.out"; then
            echo "::error::could not audit the server ($SSH_TARGET:$TARGET); the deployed tree is UNVERIFIED"
            sed -n '1,20p' "$RUNNER_TEMP/remote.out" || true
            exit 1
          fi
          # Guards against a truncated transfer: no sentinel means the audit did
          # not finish, so an empty/short manifest must not be read as "matches".
          grep -qx 'AUDITDONE' "$RUNNER_TEMP/remote.out" \
            || { echo "::error::the remote audit did not run to completion; the deployed tree is UNVERIFIED"; exit 1; }

          # TEST THE PRECONDITION THIS STEP DEPENDS ON, rather than asserting it in
          # the step name. Together with the assert-down the rsync step already
          # runs, this brackets the transfer: down before the first byte, and
          # (checked here) still down after the audit read the tree. If it is up
          # now, everything below is comparing a tree a live process has been
          # writing to, and the diff is evidence about the RACE, not about rsync.
          if "$RSSH" "FOUNDRY_DIR='$TARGET' bash -s -- assert-down" < "$LIB" >/dev/null 2>&1; then
            FOUNDRY_AFTER=down
          else
            FOUNDRY_AFTER=up
          fi
          echo "Foundry state after the audit: $FOUNDRY_AFTER"

          rc=0

          # ---- 1. non-pack files: byte-identical, no exceptions ---------------
          # The EXCLUDE patterns are matched by rsync at EVERY DEPTH, so the
          # expected manifest has to apply them at every depth too. The
          # top-level `SHIPPED` filter above cannot do that job: it only decides
          # which top-level entries to descend into. A `.md` nested inside a
          # shipped directory was therefore counted as expected while rsync
          # never sent it, and the step failed reporting a one-line deficit --
          # blaming the transfer for an exclusion working exactly as configured.
          # It went unnoticed until 2026-08-03 only because every `.md` in the
          # tree had lived at the top level until then
          # (`assets/data/splats/README.md` was the first that did not).
          #
          # Deliberately asymmetric: the REMOTE audit still lists everything.
          # A file the repo excludes but the server still holds -- rsync
          # protects excluded files from `--delete`, so a stale one can outlive
          # its exclusion forever -- then appears in `deployed.sha` and not in
          # `expected.sha`, and this diff is the only thing that would catch it
          # (the leak check below reads top-level entries only).
          # shellcheck disable=SC2086
          find $PATHS -type f ! -name '*.md' ! -path '*/.git*' -print0 \
            | xargs -0 -r sha256sum | sort > "$RUNNER_TEMP/expected.sha"
          sed -n 's/^SHA //p' "$RUNNER_TEMP/remote.out" > "$RUNNER_TEMP/deployed.sha"
          FILE_COUNT="$(wc -l < "$RUNNER_TEMP/expected.sha" | tr -d ' ')"
          echo "Files verified: $FILE_COUNT"
          if ! diff -u "$RUNNER_TEMP/expected.sha" "$RUNNER_TEMP/deployed.sha"; then
            echo "::error::The deployed system tree does NOT match ${GITHUB_SHA}. rsync exited 0 but the bytes on the server differ (see diff above)."
            rc=1
          fi
          if grep -q '^MISSINGPATH ' "$RUNNER_TEMP/remote.out"; then
            sed -n 's/^MISSINGPATH /::error::path never arrived on the server: /p' "$RUNNER_TEMP/remote.out"
            rc=1
          fi

          # ---- 2. packs/: the whole LevelDB tree ------------------------------
          # CURRENT, MANIFEST-*, *.log and *.ldb are ALL compared now. The
          # previous revision could only compare *.ldb, because it ran against a
          # live Foundry that rewrites the rest as soon as it opens a pack
          # (measured 2026-07-30: the server was on MANIFEST-001258/001259.log
          # where this repo commits MANIFEST-001226/001227.log). With Foundry
          # verified down, an rsync --delete mirror makes the whole tree
          # comparable, so a rewound CURRENT or a missing MANIFEST is now caught.
          #
          # LOCK/LOG/LOG.old are excluded: LOCK is untracked (rsync --delete
          # removes it from the server, and LevelDB recreates it on the next open)
          # and LOG/LOG.old are debug logs LevelDB rewrites on open. Comparing
          # them would be noise about nothing the deploy controls.
          #
          # Whole files are hashed. Values inside a .ldb are Snappy-COMPRESSED, so
          # grepping for a string in a .ldb proves nothing about what is stored.
          find ./packs -type f ! -name LOCK ! -name LOG ! -name 'LOG.old' -print0 \
            | xargs -0 -r sha256sum | sort > "$RUNNER_TEMP/expected-packs.sha"
          sed -n 's/^PACKSHA //p' "$RUNNER_TEMP/remote.out" > "$RUNNER_TEMP/deployed-packs.sha"
          PACK_COUNT="$(wc -l < "$RUNNER_TEMP/expected-packs.sha" | tr -d ' ')"
          echo "Pack files verified: $PACK_COUNT"
          PACKS_DIFFER=0
          if ! diff -u "$RUNNER_TEMP/expected-packs.sha" "$RUNNER_TEMP/deployed-packs.sha"; then
            echo "::error::Deployed pack data does NOT match ${GITHUB_SHA} (see diff above)."
            PACKS_DIFFER=1
            rc=1
          fi

          # A LevelDB LOCK file exists only because a process opened the database.
          # rsync --delete has just removed every LOCK (none is tracked in git —
          # preflight fails the build if one ever is), so a LOCK present now means
          # something opened a pack between the transfer and this audit.
          PACKS_OPENED=0
          if grep -q '^PACKLOCK ' "$RUNNER_TEMP/remote.out"; then
            PACKS_OPENED=1
            sed -n 's/^PACKLOCK /::error::a LevelDB LOCK exists after the transfer, so a process opened this pack while Foundry was supposed to be down: /p' \
              "$RUNNER_TEMP/remote.out"
            rc=1
          fi

          # ---- 2b. say WHICH of the two failures this is -----------------------
          # These two errors read almost identically in a log and mean opposite
          # things. Getting it wrong cost a full manual investigation of run
          # 30753691518 (the conclusion there was "the deploy was fine, the check
          # is flaky" — it was the other way round: the check was right and the
          # deploy had been raced). So name the cause explicitly.
          if [ "$PACKS_DIFFER" = 1 ] || [ "$PACKS_OPENED" = 1 ]; then
            if [ "$PACKS_OPENED" = 1 ] || [ "$FOUNDRY_AFTER" = up ]; then
              echo "::error::DIAGNOSIS: SOMETHING OPENED THE PACKS INSIDE THIS DEPLOY WINDOW."
              # `|| true`, not `|| echo 0`: grep -c already PRINTS 0 before exiting
              # 1, so the fallback would emit the count twice.
              echo "::error::  LOCK files recreated after rsync: $(grep -c '^PACKLOCK ' "$RUNNER_TEMP/remote.out" || true)"
              echo "::error::  Foundry state after the audit:    $FOUNDRY_AFTER"
              echo "::error::This is NOT a bad transfer: a LevelDB open rewrites CURRENT and rolls"
              echo "::error::MANIFEST-*/*.log forward, so those names and hashes move while *.ldb do not."
              echo "::error::It IS the corruption hazard this workflow exists to prevent, because the"
              echo "::error::rsync --delete above unlinked files that process may now hold open."
              echo "::error::Most likely cause: a CONCURRENT DEPLOY FROM ANOTHER REPO restarted Foundry"
              echo "::error::(wod20-compendium-es and wod20-combat-foundryvtt write to the same server)."
              echo "::error::Check their Actions tabs for a run overlapping this one, then re-run this"
              echo "::error::deploy on its own. See the deploy lock in .github/scripts/foundry-deploy-lib.sh."
            else
              echo "::error::DIAGNOSIS: the pack bytes on the server are not the ones that were pushed,"
              echo "::error::and nothing appears to have opened them (no LOCK, Foundry still down)."
              echo "::error::Suspect the transfer itself: a partial rsync, a full disk, or a wrong TARGET."
            fi
          fi

          # A deployed pack that is not a usable LevelDB directory opens in
          # Foundry as an empty or broken compendium. Only the packs system.json
          # DECLARES matter; packs/abilities has been an empty LevelDB dir with no
          # *.ldb since before CD existed and Foundry never opens it, so an
          # undeclared broken dir is a warning (preflight reports it too).
          python3 -c 'import json;[print(p["path"]) for p in json.load(open("system.json"))["packs"]]' \
            | sort > "$RUNNER_TEMP/declared-packs.txt"
          while read -r pack_dir pack_state; do
            [ "$pack_state" = "OK" ] && continue
            if grep -qxF "$pack_dir" "$RUNNER_TEMP/declared-packs.txt"; then
              echo "::error::deployed pack $pack_dir is not a usable LevelDB directory (missing CURRENT, MANIFEST-* or *.ldb)"
              rc=1
            else
              echo "::warning::deployed $pack_dir is not a usable LevelDB directory, but system.json does not declare it"
            fi
          done < <(sed -n 's/^PACKSTATE //p' "$RUNNER_TEMP/remote.out")

          # ---- 3. nothing that should not be there ---------------------------
          # If the EXCLUDE args above were ever dropped or silently emptied, rsync
          # would exit 0 while shipping .git and .github into a live Foundry data
          # directory. README.md is permitted: one predates its exclusion and
          # `--delete` cannot remove it (rsync protects excluded files from
          # deletion), so listing it as a leak would fail every run.
          {
            printf '%s\n' "${SHIPPED[@]}"
            printf 'packs\nREADME.md\n'
          } | sort -u > "$RUNNER_TEMP/allowed-top.txt"
          sed -n 's/^TOP //p' "$RUNNER_TEMP/remote.out" | sort -u > "$RUNNER_TEMP/server-top.txt"
          LEAKED="$(comm -13 "$RUNNER_TEMP/allowed-top.txt" "$RUNNER_TEMP/server-top.txt" || true)"
          if [ -n "$LEAKED" ]; then
            echo "::error::Material that should not be on the server is present in $TARGET (EXCLUDE set not applied?): $(echo $LEAKED)"
            rc=1
          fi

          {
            echo "system_version=$VERSION"
            echo "files_verified=$FILE_COUNT"
            echo "pack_files_verified=$PACK_COUNT"
            echo "foundry_after_audit=$FOUNDRY_AFTER"
          } >> "$GITHUB_OUTPUT"

          if [ "$rc" = 0 ]; then
            echo "Verified: the deployed system tree is byte-identical to ${GITHUB_SHA}."
          fi
          exit $rc

      # `if: always()` — whatever failed above, Foundry must not be left stopped.
      # Guarded on the stop step having run at all: if we never stopped it (e.g.
      # checkout or SSH setup failed) there is nothing to restore.
      #
      # This restart is also what makes the system change take effect: systems are
      # read at startup. It replaces the manual `pm2 restart foundryvtt` the
      # previous revision of this file told the operator to perform.
      - name: Start Foundry and VERIFY it is back
        id: start
        if: always() && steps.stop.outcome != 'skipped'
        run: |
          set -euo pipefail
          "$RSSH" "FOUNDRY_DIR='$TARGET' bash -s -- start" < "$LIB"

      # RUNS EVEN WHEN THE BYTE VERIFICATION FAILED (changed 2026-08-02). It used
      # to have no `if:`, so a failed verify skipped it — and the stale-handle
      # measurement below is the one check that answers "did that failure actually
      # corrupt anything?". In run 30753691518 it was skipped for exactly that
      # reason and the question had to be answered by hand over ssh afterwards.
      # A failed deploy producing two errors is cheaper than a failed deploy
      # producing an unanswered question.
      #
      # Still gated on the restart having succeeded: with Foundry down there is no
      # process to read /proc/<pid>/fd from and the check cannot mean anything.
      - name: Verify the running Foundry loaded the deployed system
        id: verify_live
        if: always() && steps.start.outcome == 'success'
        run: |
          set -euo pipefail

          # system.json is not mutated by Foundry, so it must still read as pushed.
          REMOTE_VER="$("$RSSH" "bash -s -- version '$TARGET'" < "$LIB" | cut -d= -f2)"
          echo "deployed system.json version after restart: $REMOTE_VER"
          [ "$REMOTE_VER" = "${{ steps.verify.outputs.system_version }}" ] \
            || { echo "::error::system.json version changed after the restart"; exit 1; }

          # The direct incident check: a Foundry started AFTER the rsync holds ZERO
          # descriptors to deleted files under the system directory. Before this
          # revision the live process held 128 live descriptors in there that an
          # rsync --delete would have unlinked.
          "$RSSH" "FOUNDRY_DIR='$TARGET' bash -s -- stale-handles" < "$LIB"

          # If a world is active, Foundry reports the system version it actually
          # loaded — the end-to-end proof that the restart picked up this commit.
          # If no world is active there is no systemVersion to compare, which is
          # normal and not a failure.
          "$RSSH" "bash -s -- status-json" < "$LIB" > "$RUNNER_TEMP/status.json" || true
          python3 - "$RUNNER_TEMP/status.json" "${{ steps.verify.outputs.system_version }}" <<'PY'
          import json, sys
          try:
              st = json.load(open(sys.argv[1]))
          except Exception as exc:
              print(f"::warning::could not parse /api/status ({exc}); skipping the live version check")
              raise SystemExit(0)
          want = sys.argv[2]
          print(f"/api/status: {json.dumps({k: st.get(k) for k in ('active','version','world','system','systemVersion')})}")
          if st.get("system") != "worldofdarkness" or not st.get("systemVersion"):
              print("::notice::no active worldofdarkness world; the live system version cannot be checked "
                    "(the on-disk tree was verified byte-for-byte above)")
              raise SystemExit(0)
          if st["systemVersion"] != want:
              print(f"::error::the restarted Foundry is serving system version {st['systemVersion']}, "
                    f"but {want} was deployed")
              raise SystemExit(1)
          print(f"The running Foundry has loaded worldofdarkness {want}.")
          PY

      # Last step that touches shared state. `always()` so a failure anywhere above
      # cannot leave the next deploy of either repo waiting out DEPLOY_LOCK_STALE,
      # and gated on us having taken it so a run that never got the lock cannot
      # release someone else's (`unlock` re-checks the owner on the server too).
      - name: Release the cross-repo Foundry deploy lock
        if: always() && steps.lock.outcome == 'success'
        run: |
          set -uo pipefail
          "$RSSH" "DEPLOY_LOCK_OWNER='${GITHUB_REPOSITORY}#${GITHUB_RUN_ID}' bash -s -- unlock" < "$LIB" \
            || echo "::warning::could not release the deploy lock over ssh; it expires on its own"

      - name: Post-deploy notice
        if: always() && steps.rsync.outcome == 'success'
        run: |
          set -uo pipefail
          echo "Deployed the system tree to $TARGET"
          echo
          # Only claim the restart happened if the start step says it did — the
          # "Shout if Foundry is not running" step below owns the other case.
          if [ "${{ steps.start.outcome }}" = "success" ]; then
            echo "############################################################"
            echo "# The Foundry PROCESS WAS RESTARTED by this workflow.       #"
            echo "# A system change needs that restart to take effect, so     #"
            echo "# there is NO manual 'pm2 restart foundryvtt' left to do.   #"
            echo "#                                                          #"
            echo "# Connected players WERE DROPPED for the duration of the    #"
            echo "# restart, and any open world reloaded. That was already    #"
            echo "# true of the manual restart this replaces.                 #"
            echo "#                                                          #"
            echo "# What is still NOT done: nothing re-imports or migrates    #"
            echo "# world content. A data-model change that needs a migration #"
            echo "# still needs one.                                          #"
            echo "############################################################"
          else
            echo "::warning::the restart step did not report success (outcome: ${{ steps.start.outcome }}) — see the errors below; Foundry may still be DOWN."
          fi
          if [ "${{ steps.verify.outcome }}" != "success" ]; then
            echo "::error::Byte verification did not pass — the tree on the server is NOT known to be this commit. Investigate the diff above before trusting the restarted Foundry."
          fi

      - name: Deploy summary
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            echo "### worldofdarkness system deploy"
            echo
            echo "| stage | result |"
            echo "|---|---|"
            echo "| preflight (offline gate) | \`${{ needs.preflight.result }}\` |"
            echo "| cross-repo deploy lock | \`${{ steps.lock.outcome }}\` |"
            echo "| stop + verified down | \`${{ steps.stop.outcome }}\` |"
            echo "| rsync | \`${{ steps.rsync.outcome }}\` |"
            echo "| deployed bytes == pushed bytes | \`${{ steps.verify.outcome }}\` |"
            echo "| Foundry stayed down through the audit | \`${{ steps.verify.outputs.foundry_after_audit }}\` |"
            echo "| start + verified up | \`${{ steps.start.outcome }}\` |"
            echo "| no stale handles, live version matches | \`${{ steps.verify_live.outcome }}\` |"
            echo
            echo "version \`${{ steps.verify.outputs.system_version }}\`, "
            echo "\`${{ steps.verify.outputs.files_verified }}\` files + "
            echo "\`${{ steps.verify.outputs.pack_files_verified }}\` pack files verified"
            echo
            echo "#### Final Foundry state"
            echo '```'
            # ${RSSH:-} on purpose: if the run died before "Resolve runner-temp
            # paths", `set -u` on a bare $RSSH would abort this step and lose the
            # table above, which is the one thing that is always worth printing.
            if [ -n "${RSSH:-}" ] && [ -x "${RSSH:-}" ]; then
              "$RSSH" "FOUNDRY_DIR='$TARGET' bash -s -- state" < "$LIB" 2>&1 \
                || echo "could not reach the server"
            else
              echo "ssh was never configured in this run; no server state to report"
            fi
            echo '```'
            echo
            echo "**This workflow restarts the Foundry process, which is what makes a system change take effect.**"
            echo "Connected players are dropped for the duration of that restart."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Shout if Foundry is not running
        if: always() && steps.start.outcome == 'failure'
        run: |
          echo "::error::################################################################"
          echo "::error::FOUNDRY IS DOWN and this workflow could not bring it back."
          echo "::error::Every world on the server is offline. Fix it by hand NOW:"
          echo "::error::  ssh <foundry server>"
          echo "::error::  export NVM_DIR=/var/www/.nvm && . \$NVM_DIR/nvm.sh"
          echo "::error::  pm2 start foundryvtt && pm2 logs foundryvtt --lines 50"
          echo "::error::################################################################"
          exit 1
